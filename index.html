<html>

<head>
  <meta charset="utf-8">

  <meta name="twitter:description" content="A first-of-its-kind augmented reality experience celebrating the 30th anniversary of OutKast's ATLiens, transforming public spaces into immersive journeys through Atlanta's hip-hop legacy.">

  <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">

  <script crossorigin="anonymous" src="./external/runtime/runtime.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" crossorigin="anonymous" data-preload-chunks="slam"></script>
  <script src="//cdn.8thwall.com/web/xrextras/xrextras.js" crossorigin="anonymous"></script>

  <meta property="og:image" content="./assets/preview.jpg">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Fullscreen Splash Screen Overlay */
    #start-overlay {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: url('./assets/SplashScreen.jpg') center center / cover no-repeat;
      display: flex;
      justify-content: center;
      transition: opacity 0.45s ease;
      pointer-events: auto;
    }

    /* Top Left Info Button */
    #info-link {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100000;
      display: none;
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.2s ease;
      pointer-events: auto;
    }

    #info-link.visible {
      display: block;
      opacity: 1;
    }

    #info-link:active {
      transform: scale(0.9);
    }

    #info-link img {
      display: block;
      width: 40px;
      height: 40px;
    }

    /* Top Right Music Toggle Button */
    #music-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100000;
      display: none;
      opacity: 0;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      transition: opacity 0.4s ease, transform 0.2s ease;
      pointer-events: auto;
    }

    #music-toggle.visible {
      display: block;
      opacity: 1;
    }

    #music-toggle:active {
      transform: scale(0.9);
    }

    #music-toggle img {
      display: block;
      width: 40px;
      height: 40px;
    }

    /* Floating Keyframes Animation */
    @keyframes float {
      0% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-8px) scale(1.02); }
      100% { transform: translateY(0px) scale(1); }
    }

    /* Center Start AR Button */
    #start-button {
      position: absolute;
      bottom: 20px;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      pointer-events: none;
      opacity: 0.5;
      transition: opacity 0.4s ease;
    }

    #start-button img {
      display: block;
      width: min(80vw, 320px);
      height: auto;
    }

    #start-button.active {
      pointer-events: auto;
      opacity: 1;
      animation: float 2.4s ease-in-out infinite;
    }

    #start-button:active {
      animation: none;
      transform: scale(0.95);
    }

    /* Bottom Creator Credit */
    .creator-credit {
      position: absolute;
      left: 50%;
      bottom: max(16px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      font-family: "Nunito", sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.5px;
      line-height: 1;
      color: #b9fe0d;
      text-align: center;
      white-space: nowrap;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45);
      pointer-events: auto;
      user-select: none;
    }

    .creator-credit a {
      color: #b9fe0d;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    .creator-credit a:hover { opacity: 1; }
    .creator-credit a:not(:hover) { opacity: 0.85; }

    #xr-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    /* Custom Media Recorder Styling */
    .recorder-container {
      position: fixed;
      bottom: max(30px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      width: 76px;
      height: 76px;
      z-index: 100000;
      display: none;
      opacity: 0;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease;
      pointer-events: auto;
    }

    .recorder-container.visible {
      display: flex;
      opacity: 1;
    }

    .style-reset {
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      font: inherit;
      color: inherit;
      cursor: pointer;
      outline: none;
    }

    #recorder-button {
      position: absolute;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #b9fe0d;
      color: transparent;
      font-size: 0;
      transition: transform 0.15s ease, background-color 0.2s ease, border-radius 0.2s ease;
      z-index: 2;
    }

    #recorder-button:active {
      transform: scale(0.92);
    }

    .recorder-container.recording #recorder-button {
      background: #ff3b30;
      transform: scale(0.65);
      border-radius: 8px;
    }

    .progress-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      z-index: 1;
    }

    .progress-track {
      fill: none;
      stroke: rgba(255, 255, 255, 0.3);
      stroke-width: 3;
    }

    .progress-bar {
      fill: none;
      stroke: #b9fe0d;
      stroke-width: 3.5;
      stroke-dasharray: 100.53; /* 2 * PI * r (16) = 100.53 */
      stroke-dashoffset: 100.53;
      transition: stroke-dashoffset 0.1s linear;
    }

    .recorder-container.recording .progress-bar {
      stroke: #ff3b30;
    }

    .loading-circle {
      fill: none;
      stroke: transparent;
      stroke-width: 3;
    }

    /* Photo Camera Flash Effect */
    .flash-element {
      position: fixed;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 200000;
      transition: opacity 0.08s ease-out;
    }

    .flash-element.flash {
      opacity: 1;
    }
  </style>
</head>

<body>
  <script src="bundle.js"></script>

  <audio id="bg-music" src="./assets/bg-music.mp3" loop></audio>

  <!-- Top Controls -->
  <a id="info-link" href="https://www.instagram.com/canikickittho" target="_blank" rel="noopener noreferrer">
    <img src="assets/Info.png" alt="Book Info">
  </a>

  <button id="music-toggle" aria-label="Toggle Music">
    <img id="music-icon" src="./assets/Music_On.png" alt="Music On">
  </button>

  <!-- Custom Recorder UI -->
  <div id="recorder" class="recorder-container">
    <svg viewBox="0 0 38 38" class="progress-container">
      <circle class="progress-track" r="16" cx="19" cy="19"></circle>
      <circle id="progressBar" class="progress-bar" r="16" cx="19" cy="19"></circle>
      <circle class="loading-circle" r="16" cx="19" cy="19"></circle>
    </svg>

    <button id="recorder-button" class="style-reset">
      Record
    </button>
  </div>

  <div id="flashElement" class="flash-element"></div>

  <!-- Splash Screen Container -->
  <div id="start-overlay">
    <button id="start-button"><img src="./assets/StartAR.png" alt="Start AR"></button>
    <div class="creator-credit">
      <a href="https://shaleshshekhar.in" target="_blank" rel="noopener noreferrer">WebAR by Shalesh Shekhar</a>
    </div>
  </div>

  <canvas id="xr-canvas"></canvas>

  <script>
    window.addEventListener("load", () => {
      const button = document.getElementById("start-button");
      const infoLink = document.getElementById("info-link");
      const musicBtn = document.getElementById("music-toggle");
      const musicIcon = document.getElementById("music-icon");
      const bgMusic = document.getElementById("bg-music");

      const recorderContainer = document.getElementById("recorder");
      const recorderBtn = document.getElementById("recorder-button");
      const progressBar = document.getElementById("progressBar");
      const flashElem = document.getElementById("flashElement");

      let isMusicPlaying = true;
      let isRecording = false;
      let holdTimer = null;
      let pressStartTime = 0;
      const MAX_RECORDING_MS = 30000;
      const CIRCLE_CIRCUMFERENCE = 100.53;

      musicBtn.onclick = (e) => {
        e.stopPropagation();
        if (isMusicPlaying) {
          musicIcon.src = "./assets/Music_Off.png";
          musicIcon.alt = "Music Off";
          bgMusic.pause();
          isMusicPlaying = false;
        } else {
          musicIcon.src = "./assets/Music_On.png";
          musicIcon.alt = "Music On";
          bgMusic.play().catch(() => { });
          isMusicPlaying = true;
        }
      };

      // Trigger Screen Flash Effect
      const triggerFlash = () => {
        flashElem.classList.add("flash");
        setTimeout(() => flashElem.classList.remove("flash"), 150);
      };

      // Set Progress Bar Offset
      const setProgress = (ratio) => {
        const offset = CIRCLE_CIRCUMFERENCE * (1 - ratio);
        progressBar.style.strokeDashoffset = offset;
      };

      // Take Photo via CanvasScreenshot
      const takePhoto = () => {
        triggerFlash();
        if (window.XR8 && XR8.CanvasScreenshot) {
          XR8.CanvasScreenshot.takeScreenshot().then((data) => {
            const img = new Image();
            img.src = 'data:image/jpeg;base64,' + data;
            const w = window.open("");
            w.document.write(img.outerHTML);
          }).catch((err) => console.error("Photo failed:", err));
        }
      };

      // Start Recording
      const startVideo = () => {
        if (!window.XR8 || !XR8.MediaRecorder) return;
        isRecording = true;
        recorderContainer.classList.add("recording");

        XR8.MediaRecorder.recordVideo({
          onStart: () => {},
          onStop: () => {
            isRecording = false;
            recorderContainer.classList.remove("recording");
            setProgress(0);
          },
          onProcessFrame: ({ elapsedTimeMs }) => {
            const ratio = Math.min(elapsedTimeMs / MAX_RECORDING_MS, 1);
            setProgress(ratio);
          },
          onVideoReady: ({ videoUrl }) => {
            window.open(videoUrl, "_blank");
          },
          onError: (err) => {
            console.error("Recording error:", err);
            isRecording = false;
            recorderContainer.classList.remove("recording");
            setProgress(0);
          }
        });
      };

      // Stop Recording
      const stopVideo = () => {
        if (window.XR8 && XR8.MediaRecorder && isRecording) {
          XR8.MediaRecorder.stopRecording();
        }
      };

      // Handle Tap / Hold logic on record button
      recorderBtn.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        pressStartTime = Date.now();

        if (isRecording) {
          stopVideo();
          return;
        }

        holdTimer = setTimeout(() => {
          startVideo();
        }, 300);
      });

      recorderBtn.addEventListener("pointerup", (e) => {
        e.preventDefault();
        clearTimeout(holdTimer);

        if (!isRecording) {
          const pressDuration = Date.now() - pressStartTime;
          if (pressDuration < 300) {
            takePhoto();
          }
        } else {
          stopVideo();
        }
      });

      // Pipeline Init
      const initPipeline = () => {
        if (window.XR8 && XR8.MediaRecorder) {
          XR8.addCameraPipelineModules([
            XR8.MediaRecorder.pipelineModule(),
          ]);
        }
      };

      const activateButton = () => {
        button.classList.add("active");
        initPipeline();
      };

      if (window.XR8) {
        activateButton();
      } else {
        window.addEventListener("xrloaded", activateButton);
      }

      button.onclick = async () => {
        if (!button.classList.contains("active")) return;

        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          if (ctx.state === 'suspended') await ctx.resume();
          if (isMusicPlaying) {
            bgMusic.play().catch(() => { });
          }
        } catch (e) { }

        const overlay = document.getElementById("start-overlay");
        overlay.style.opacity = 0;
        setTimeout(() => overlay.remove(), 450);

        infoLink.classList.add("visible");
        musicBtn.classList.add("visible");
        recorderContainer.classList.add("visible");
      };
    });
  </script>
</body>

</html>
