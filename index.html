  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Fullscreen Splash Screen Overlay */
    #start-overlay {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: url('./assets/SplashScreen.jpg') center center / cover no-repeat;
      display: flex;
      justify-content: center;
      transition: opacity 0.45s ease;
      pointer-events: auto;
    }

    /* Top Left Info Button */
    #info-link {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 9000;
      display: none;
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.2s ease;
      pointer-events: auto;
    }

    #info-link.visible {
      display: block;
      opacity: 1;
    }

    #info-link:active {
      transform: scale(0.9);
    }

    #info-link img {
      display: block;
      width: 40px;
      height: 40px;
    }

    /* Top Right Music Toggle Button */
    #music-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9000;
      display: none;
      opacity: 0;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      transition: opacity 0.4s ease, transform 0.2s ease;
      pointer-events: auto;
    }

    #music-toggle.visible {
      display: block;
      opacity: 1;
    }

    #music-toggle:active {
      transform: scale(0.9);
    }

    #music-toggle img {
      display: block;
      width: 40px;
      height: 40px;
    }

    /* Floating Keyframes Animation */
    @keyframes float {
      0% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-8px) scale(1.02); }
      100% { transform: translateY(0px) scale(1); }
    }

    /* Center Start AR Button */
    #start-button {
      position: absolute;
      bottom: 20px;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      pointer-events: none;
      opacity: 0.5;
      transition: opacity 0.4s ease;
    }

    #start-button img {
      display: block;
      width: min(80vw, 320px);
      height: auto;
    }

    #start-button.active {
      pointer-events: auto;
      opacity: 1;
      animation: float 2.4s ease-in-out infinite;
    }

    #start-button:active {
      animation: none;
      transform: scale(0.95);
    }

    /* Bottom Creator Credit */
    .creator-credit {
      position: absolute;
      left: 50%;
      bottom: max(16px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      font-family: "Nunito", sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.5px;

      color: #b9fe0d;
      text-align: center;
      white-space: nowrap;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45);
      pointer-events: auto;
      user-select: none;

    .creator-credit a {
      color: #b9fe0d;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    .creator-credit a:hover { opacity: 1; }
    .creator-credit a:not(:hover) { opacity: 0.85; }

    #xr-canvas {
      position: fixed;
      inset: 0;

    /* Custom Theme Overrides */
    .recorder-container {
      z-index: 9500 !important;

    .recorder-container #recorder-button {
      background: #b9fe0d !important;
    }
    .recorder-container .progress-bar {
      stroke: #b9fe0d !important;
    }
    .recorder-container.recording #recorder-button {
      background: #ff3b30 !important;

    /* Preview Modal Layering */
    #previewContainer {
      z-index: 100001 !important;
    }

    #previewContainer #actionButton {
      background-color: #b9fe0d !important;
      color: #000000 !important;
      font-weight: 700;
    }

    /* Keep active in DOM render tree without showing on screen */
    .ar-video-asset {
      position: absolute;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;

<body>
  <!-- Background Music Element -->
  <audio id="bg-music" src="./assets/bg-music.mp3" loop crossorigin="anonymous"></audio>

  <!-- AR Target Video Asset -->
  <video id="ar-video" class="ar-video-asset" src="assets/arvideos/Artwork.mp4" playsinline webkit-playsinline loop muted crossorigin="anonymous" preload="auto"></video>

  <!-- Top UI Controls -->
  <a id="info-link" href="https://www.instagram.com/canikickittho" target="_blank" rel="noopener noreferrer" aria-label="Book Info">
    <img src="assets/Info.png" alt="Book Info">
  </a>

  <button id="music-toggle" aria-label="Toggle Music">
    <img id="music-icon" src="./assets/Music_On.png" alt="Music On">
  </button>

  <!-- Splash Screen Container -->
  <div id="start-overlay">
    <button id="start-button" aria-label="Start AR"><img src="./assets/StartAR.png" alt="Start AR"></button>
    <div class="creator-credit">
      <a href="https://shaleshshekhar.in" target="_blank" rel="noopener noreferrer">WebAR by Shalesh Shekhar</a>
    </div>
  </div>

  <canvas id="xr-canvas"></canvas>

  <script src="bundle.js" defer></script>

  <script>
    window.addEventListener("load", () => {
      const button = document.getElementById("start-button");
      const infoLink = document.getElementById("info-link");
      const musicBtn = document.getElementById("music-toggle");
      const musicIcon = document.getElementById("music-icon");
      const bgMusic = document.getElementById("bg-music");

      let isMusicPlaying = true;
      let wasMusicPlayingBeforePreview = false;
      let bgAudioNode = null;

      // Music Toggle Control
      musicBtn.onclick = (e) => {
        e.stopPropagation();
        if (isMusicPlaying) {
          musicIcon.src = "./assets/Music_Off.png";
          musicIcon.alt = "Music Off";
          bgMusic.pause();
          isMusicPlaying = false;
        } else {
          musicIcon.src = "./assets/Music_On.png";
          musicIcon.alt = "Music On";
          bgMusic.play().catch(() => { });
          isMusicPlaying = true;
        }
      };

      // Pause audio when preview modal opens & resume on close
      window.addEventListener("mediarecorder-previewopened", () => {
        wasMusicPlayingBeforePreview = isMusicPlaying;
        if (isMusicPlaying) {
          bgMusic.pause();
        }
      });

      window.addEventListener("mediarecorder-previewclosed", () => {
        if (wasMusicPlayingBeforePreview && isMusicPlaying) {
          bgMusic.play().catch(() => { });
        }
      });

      // Configure background audio stream for video recording
      const userConfiguredAudioOutput = ({ microphoneInput, audioProcessor }) => {
        const audioCtx = (microphoneInput && microphoneInput.context) 
          ? microphoneInput.context 
          : new (window.AudioContext || window.webkitAudioContext)();

        if (!bgAudioNode && bgMusic) {
          try {
            bgAudioNode = audioCtx.createMediaElementSource(bgMusic);
          } catch (e) {
            console.warn("Audio node creation warning:", e);
          }
        }

        if (bgAudioNode) {
          bgAudioNode.connect(audioProcessor);
          bgAudioNode.connect(audioCtx.destination);
        }

        if (microphoneInput) {
          microphoneInput.connect(audioProcessor);
        }

        return audioProcessor;
      };

      // Prevent Duplicate Pipeline Modules
      const initMediaRecorder = () => {
        if (window.XR8) {
          const modules = [];

          if (XR8.MediaRecorder && (!XR8.hasCameraPipelineModule || !XR8.hasCameraPipelineModule('mediarecorder'))) {
            modules.push(XR8.MediaRecorder.pipelineModule());

            XR8.MediaRecorder.configure({
              configureAudioOutput: userConfiguredAudioOutput,
              requestMic: XR8.MediaRecorder.RequestMicOptions.AUTO,
            });
          }

          if (XR8.CanvasScreenshot && (!XR8.hasCameraPipelineModule || !XR8.hasCameraPipelineModule('canvasscreenshot'))) {
            modules.push(XR8.CanvasScreenshot.pipelineModule());
          }

          if (modules.length > 0) {
            XR8.addCameraPipelineModules(modules);
          }
        }

        if (window.XRExtras && XRExtras.MediaRecorder) {
          XRExtras.MediaRecorder.configure({
            enableEndCard: false,
            watermarkImageUrl: null,
          });

          XRExtras.MediaRecorder.initRecordButton();
          XRExtras.MediaRecorder.initMediaPreview();
        }
      };

      const activateButton = () => {
        button.classList.add("active");
        initMediaRecorder();
      };

      if (window.XR8) {
        activateButton();
      } else {
        window.addEventListener("xrloaded", activateButton);
      }

      // Start AR Session Handler
      button.onclick = async () => {
        if (!button.classList.contains("active")) return;

        // Ensure all video elements on the page (both custom and 8th Wall internal) are unmuted & played
        document.querySelectorAll("video").forEach((vid) => {
          vid.muted = true;
          vid.play().catch(() => {});
        });

        // Resume Audio Context and start music playback
        try {
          if (isMusicPlaying) {
            await bgMusic.play();
          }
        } catch (e) { }

        // Fade out splash screen overlay
        const overlay = document.getElementById("start-overlay");
        overlay.style.opacity = 0;
        setTimeout(() => overlay.remove(), 450);

        infoLink.classList.add("visible");
        musicBtn.classList.add("visible");
      };
    });
  </script>
</body>
